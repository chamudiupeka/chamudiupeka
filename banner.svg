<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.09"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <circle cx="1010" cy="55" r="210" fill="url(#glow1)">
      <animate attributeName="r" values="190;230;190" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="300" r="170" fill="url(#glow2)">
      <animate attributeName="r" values="150;190;150" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- terminal title bar -->
    <rect x="0" y="0" width="1200" height="46" fill="#000000" opacity="0.28"/>
    <circle cx="30" cy="23" r="7" fill="#ff5f56"/>
    <circle cx="55" cy="23" r="7" fill="#ffbd2e"/>
    <circle cx="80" cy="23" r="7" fill="#27c93f"/>
    <text x="600" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9ca3af">chamudi@software-engineer — zsh</text>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- terminal body -->
    <text x="60" y="108" font-family="Consolas, monospace" font-size="18" fill="#6b7280">chamudi@dev:~$ whoami</text>
    <text x="60" y="168" font-family="Consolas, monospace" font-size="52" font-weight="700" fill="#f8fafc">Chamudi Upeka</text>

    <text x="60" y="220" font-family="Consolas, monospace" font-size="18" fill="#6b7280">chamudi@dev:~$ cat role.txt</text>
    <text x="60" y="255" font-family="Consolas, monospace" font-size="20" fill="#2dd4bf">Software Engineer &#183; QA Automation &#183; Full-Stack Developer</text>
    <rect x="782" y="238" width="12" height="22" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="1120" y="300" font-family="Consolas, monospace" font-size="42" fill="#ffffff" opacity="0.07">&lt;/&gt;</text>
  </g>
</svg>
